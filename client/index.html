<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="VR English Vocabulary Learning Platform">
  <title>VR 英语词汇学习平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
    }
    
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 20px;
      font-size: 18px;
      color: #b0bec5;
    }
    
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    
    canvas {
      display: block;
    }
    
    /* HUD 层样式 */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    #hud > * {
      pointer-events: auto;
    }
    
    /* VR 进入按钮 */
    #vr-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      z-index: 200;
    }
    
    #vr-button:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    #vr-button:disabled {
      background: #666;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    /* 信息面板 */
    #info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      max-width: 300px;
    }
    
    #info-panel h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #4fc3f7;
    }
    
    #info-panel p {
      color: #b0bec5;
      line-height: 1.5;
    }
    
    /* 模块指示器 */
    #module-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
    }
    
    .module-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }
    
    .module-dot.active {
      background: #4fc3f7;
      box-shadow: 0 0 10px #4fc3f7;
    }
    
    .module-dot.completed {
      background: #4caf50;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="loading-spinner"></div>
      <p class="loading-text">正在加载学习场景...</p>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="hud">
      <div id="info-panel">
        <h2 id="module-title">准备中...</h2>
        <p id="module-description">正在初始化学习模块</p>
      </div>
      
      <div id="module-indicator"></div>
    </div>
    
    <button id="vr-button" disabled>检测 VR 设备中...</button>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
